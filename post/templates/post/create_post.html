{% extends "base.html" %}

{% block title %}Create Post{% endblock title %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Create Post</h1>

    <form method="post" enctype="multipart/form-data" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
            <div class="[&_textarea]:w-full [&_textarea]:h-40 [&_textarea]:border [&_textarea]:border-gray-300 [&_textarea]:rounded-lg [&_textarea]:p-3 [&_textarea]:focus:outline-none [&_textarea]:focus:ring-2 [&_textarea]:focus:ring-blue-500">
                {{ form.content }}
            </div>
            {{ form.content.errors }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
            <div class="text-sm text-gray-600 [&_input]:w-full [&_input]:border [&_input]:border-gray-300 [&_input]:rounded-lg [&_input]:p-2">
                {{ form.image }}
            </div>
            {{ form.image.errors }}
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg">
                Upload
            </button>
            <a href="{% url 'dashboard' %}" class="text-sm text-gray-600 hover:underline">Cancel</a>
        </div>
    </form>
</div>
{% endblock content %}
