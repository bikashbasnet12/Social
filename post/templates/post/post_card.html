<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
        <a href="{% url 'create' %}" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">
            Create Post
        </a>
    </div>

    {% for p in post %}
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm mb-6 overflow-hidden">
        <a href="{% url 'user_profile' p.user.username %}" class="flex items-center gap-3 p-4 hover:opacity-80">
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-semibold">
                {{ p.user.first_name|slice:":1"|upper }}
            </div>
            <p class="font-semibold text-gray-800">{{ p.user.first_name|default:p.user.username }}</p>
        </a>

        <p class="px-4 pb-4 text-gray-700">{{ p.content }}</p>

        {% if p.image %}
        <img src="{{ p.image.url }}" alt="Post image" class="w-full max-h-96 object-cover">
        {% endif %}
    </div>
    {% empty %}
    <p class="text-center text-gray-500">No posts yet.</p>
    {% endfor %}
</div>
